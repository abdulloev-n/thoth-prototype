<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thoth: кликабельный прототип</title>
<style>
/* Layout: phone frame in the middle, screen map panel on the left (desktop only) */
:root{
  --bg:#e9ecea; --surface:#fff; --ink:#1b2321; --muted:#66726e; --line:#dde2df; --soft:#f3f5f4;
  --accent:#0f6b5c; --accent-ink:#fff; --accent-soft:#dcefea;
  --again:#c4423a; --hard:#c9772b; --good:#0f6b5c; --easy:#2f6bb3;
  --new:#d9769f; --learn:#8a5cc7; --master:#4a7fb8;
  --new-bg:#f4e2eb; --new-ink:#b04677; --learn-bg:#ece3f6; --learn-ink:#6d3fb0; --done-bg:#e3eef8; --done-ink:#2f629b; --page:#f5f6f7;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.stage{min-height:100%;display:flex;gap:24px;justify-content:center;align-items:center;padding:16px}
.side{width:250px;align-self:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:calc(100vh - 32px);overflow:auto}
.side h2{font-size:14px;margin:0 0 4px}
.side p{font-size:12px;color:var(--muted);margin:0 0 10px}
.side button.j{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 6px;border-radius:6px;font-size:13px}
.side button.j:hover{background:var(--soft)}
.side button.j i{font-style:normal;font-family:ui-monospace,monospace;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;min-width:22px;text-align:center}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 6px 2px}
.side .reset{margin-top:12px;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:12px;width:100%}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 32px));background:var(--page);border-radius:28px;box-shadow:0 0 0 8px #1b2321,0 20px 50px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column}
.mapbtn{display:none}
@media (max-width:1000px){.side{display:none}.mapbtn{display:block;position:fixed;top:6px;right:6px;z-index:50;border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:999px;padding:3px 10px;font-size:12px}}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.top{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;min-height:56px}
.top h1{font-size:20px;margin:0;flex:1;padding-left:6px}
.top .ttl{flex:1;font-weight:600;text-align:center;font-size:16px}
.ib{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:hover{background:var(--soft)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[disabled]{opacity:.3;cursor:default}
.body{touch-action:pan-y;flex:1;overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.foot{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:6px}
.tabbar button{flex:1;border:0;background:none;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:54px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.big{background:var(--accent);color:var(--accent-ink);border:0;padding:18px}
.nums{display:flex;gap:20px;margin:6px 0 14px}
.nums b{font-size:30px;display:block;line-height:1}
.nums span{font-size:12px;opacity:.85}
.btn{border:0;border-radius:12px;padding:0 16px;min-height:48px;font-weight:600;width:100%}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.inv{background:#fff;color:var(--accent)}
.btn.sec{background:var(--soft);border:1px solid var(--line)}
.btn.dng{background:var(--again);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}
.row2 .btn{min-height:44px;font-weight:500}
.ghost .btn.sec{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:56px}
.li:first-child{border-top:0}
.li:hover{background:var(--soft)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.pill{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-weight:600;white-space:nowrap}
.pill.warn{background:#fbe6e3;color:var(--again)}
.h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px -4px}
.banner{background:#fff4e0;border:1px solid #f0d49a;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.banner b{display:block}
.input,.sel,.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);min-height:44px}
.ta{min-height:130px;font-family:ui-monospace,monospace;font-size:13px;resize:vertical}
.input:focus,.sel:focus,.ta:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.leg{display:flex;gap:14px;font-size:12.5px;margin-top:8px;flex-wrap:wrap}
.leg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:17px}
.empty .btn{margin-top:8px}
.fc{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px}
.fcard{width:100%;min-height:300px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 6px 20px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px;cursor:pointer}
.fcard .w{font-size:30px;font-weight:650}
.fcard .tr{font-size:22px;color:var(--accent);font-weight:600}
.fcard .ex{font-size:14px;color:var(--muted);font-style:italic}
.fcard .hint{font-size:12px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:0;border-radius:12px;min-height:52px;color:#fff;font-weight:600;font-size:13px}
.prog{height:4px;background:var(--soft)}
.prog i{display:block;height:100%;background:var(--accent)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;min-height:52px;margin-bottom:8px}
.opt:hover{background:var(--soft)}
.opt.ok{background:#dff3e8;border-color:#2f9e6f}
.opt.bad{background:#fbe6e3;border-color:var(--again)}
.q{font-size:26px;font-weight:650;margin:10px 0 4px}
.qs{font-size:13px;color:var(--muted)}
.fb{padding:10px 12px;border-radius:10px;font-size:14px}
.fb.ok{background:#dff3e8}.fb.bad{background:#fbe6e3}
.big-pct{font-size:56px;font-weight:700;color:var(--accent);line-height:1}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);gap:4px}
.chart i{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;display:block}
.chart div.today i{background:#e0a030}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:var(--muted)}
.erow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.erow .input{padding:9px 10px;min-height:42px}
.erow .ib{width:36px;height:36px}
.ex-t{border:0;background:none;color:var(--accent);font-size:12.5px;padding:2px 0}
.rowc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.scrim{position:absolute;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:flex-end;z-index:20}
.scrim.mid{align-items:center;padding:24px}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:14px 16px 18px;max-height:85%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg{background:var(--surface);width:100%;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.dlg h3,.sheet h3{margin:0;font-size:17px}
.dlg p{margin:0;color:var(--muted)}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 4px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#1b2321;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.note{font-size:12px;color:var(--muted)}
.mis{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mis:first-child{border-top:0}
.sw{display:flex;align-items:center;gap:10px}

.streak{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;height:36px;font-weight:600;font-size:14px}
.streak svg{width:16px;height:16px;fill:#e0762b;stroke:none}
.swr{position:relative;overflow:hidden;touch-action:pan-y}
.swr .swfg{position:relative;background:var(--surface);transition:transform .18s}
.swr.drag .swfg{transition:none}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;font-weight:600;font-size:14px}
.swr[data-dir="r"] .swbg{background:var(--again)}
.swr[data-dir="l"] .swbg{background:#59656a}
.swr[data-dir="r"] .swbg .r,.swr[data-dir="l"] .swbg .l{visibility:hidden}
.list>.swr+.swr{border-top:1px solid var(--line)}
.swr .li{border-top:0}
.swr.tc{border-radius:16px;border:1px solid var(--line);margin-bottom:10px}
.dtitle{font-size:26px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1.15;word-break:break-word}
.pv{position:relative;min-height:220px;background:var(--surface);border-radius:22px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:36px 24px 24px;text-align:center;font-size:24px;font-weight:600;cursor:pointer;touch-action:pan-y}
.pv small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:8px;font-style:italic}
.pv .ic{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.dots{display:flex;justify-content:center;align-items:center;gap:7px;margin:2px 0 4px}
.dots i{display:block;width:8px;height:8px;border-radius:50%;background:#cfd5d2}
.dots i.on{background:var(--ink)}.dots i.s{width:5px;height:5px}
.pcard{background:var(--surface);border-radius:22px;border:1px solid var(--line);padding:16px}
.phd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.phd b{font-size:19px}
.chip-pct{background:var(--learn-bg);color:var(--learn-ink);border-radius:999px;padding:4px 14px;font-weight:600;font-size:14px}
.prow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pillr{display:flex;align-items:center;gap:10px;border-radius:999px;padding:9px 14px;background:var(--bg0);color:var(--ink0);font-weight:600;min-width:128px}
.pillr svg{width:26px;height:26px;flex:none}
.prow b{font-weight:500}
.prow .pc{color:var(--muted);font-size:12.5px;margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;font-weight:600;background:var(--bg0);color:var(--ink0)}
.tag svg{width:20px;height:20px}
.tag.n{--bg0:var(--new-bg);--ink0:var(--new-ink)}.tag.l{--bg0:var(--learn-bg);--ink0:var(--learn-ink)}.tag.m{--bg0:var(--done-bg);--ink0:var(--done-ink)}
.pillr.n{--bg0:var(--new-bg);--ink0:var(--new-ink)}.pillr.l{--bg0:var(--learn-bg);--ink0:var(--learn-ink)}.pillr.m{--bg0:var(--done-bg);--ink0:var(--done-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x}
.chips button{flex:none;border:0;background:var(--surface);border-radius:999px;padding:0 16px;min-height:40px;font-weight:500;white-space:nowrap}
.chips button.on{background:#111;color:#fff}
.tc .th{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tc .nn{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:12px}
.tc .sp{margin-left:auto;display:flex}
.tc .tw{font-weight:600;font-size:16px;padding-bottom:12px;border-bottom:2px solid var(--soft)}
.tc .tt{padding-top:12px;font-size:16px}
.tc .te{font-size:13px;color:var(--muted);margin-top:6px}
.body>*{flex-shrink:0}
.foot.stk{background:linear-gradient(transparent,var(--page) 30%);border-top:0}
.btn.teal{background:#76cfc2;color:#14463f}
.hintline{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.stat-deck{cursor:pointer;text-align:left;width:100%}
</style>
</head>

<button class="mapbtn" data-a="mapopen">Карта экранов</button>

<script>
"use strict";
/* ---------- icons ---------- */
const I={
 back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
let uid=1000;const nid=p=>p+(uid++);

const W=[
 ["ubiquitous","повсеместный","Smartphones have become ubiquitous in modern life.","Часто в формальном тексте"],
 ["ephemeral","недолговечный","Fame can be ephemeral.",""],

 ["inevitable","неизбежный","Change is inevitable.",""],

const B=[
 ["leverage","рычаг, использовать","",""],["stakeholder","заинтересованная сторона","",""],
 ["deadline","крайний срок","The deadline is Friday.",""],["revenue","выручка","",""],
 ["onboarding","введение в должность","",""],["bottleneck","узкое место","",""]];
function mk(list,stat){return list.map((r,i)=>({id:nid('c'),w:r[0],t:r[1],ex:r[2],ctx:r[3],status:stat[i]||'new',due:(stat[i]||'new')==='new'||stat[i]==='learning'&&i%2===0}))}
function initial(){
 return {
  decks:[
   {id:'d1',name:'Advanced words',lang:'Английский',newPerDay:5,newToday:0,retention:0.9,direction:'forward',cards:mk(W,['mastered','mastered','mastered','learning','learning','learning','learning'])},

   {id:'t1',type:'deck',days:27,deck:{id:'d9',name:'Old idioms',lang:'Английский',newPerDay:5,newToday:0,retention:0.9,direction:'forward',cards:mk([["hit the sack","пойти спать","",""],["spill the beans","проболтаться","",""]],[])}},
   {id:'t2',type:'card',days:4,deckId:'d1',card:{id:nid('c'),w:'fleeting',t:'мимолётный',ex:'',ctx:'',status:'new',due:true}}],
  week:[18,32,0,27,41,22,0], streak:4, total30:412, correct30:354, minutes30:200,
  lastBackup:9, restored:false
 };
}

/* ---------- queue logic ---------- */
function queue(deckId){
 const out=[];
 for(const d of S.decks){
  if(deckId&&d.id!==deckId)continue;
  let left=Math.max(0,d.newPerDay-d.newToday);
  for(const c of d.cards){
   if(!c.due)continue;
   if(c.status==='new'){if(left>0){out.push({c,d});left--}}
   else out.push({c,d});
  }
 }
 return out;
}
const dueCount=id=>queue(id).length;
function counts(cards){const r={new:0,learning:0,mastered:0};cards.forEach(c=>r[c.status]++);return r}
function nextText(){return 'Следующее повторение через 3 ч'}

/* ---------- sessions ---------- */
function startSession(mode,deckId,extra){
 let items=queue(deckId);
 if(extra||!items.length&&mode!=='study'){
  const pool=[];S.decks.forEach(d=>{if(!deckId||d.id===deckId)d.cards.forEach(c=>{if(c.status!=='new')pool.push({c,d})})});
  items=pool.sort(()=>Math.random()-.5).slice(0,8);
 }
 if(!items.length){toast('Нет карточек для сессии');return}
 const ids=items.map(x=>x.c.id);
 sess={mode,deckId,scope:deckId?deckById(deckId).name:'Все колоды',ids,i:0,flip:false,hist:[],answered:0,correct:0,mistakes:[],start:Date.now(),pool:items.map(x=>x.c),extra:!!extra,fb:null,retry:[]};
 if(mode==='learn')sess.qs=ids.map(id=>({id,type:'choice'}));
 if(mode==='test')sess.qs=buildTest(items.map(x=>x.c));
 go('session',{});
}
function findCard(id){for(const d of S.decks){const c=d.cards.find(x=>x.id===id);if(c)return {c,d}}return null}
function allCards(){return S.decks.flatMap(d=>d.cards)}
function options(c){
 const pool=sess.pool.concat(allCards()).filter(x=>x.id!==c.id);
 const seen=new Set([c.t]);const opts=[c];
 for(const x of pool.sort(()=>Math.random()-.5)){if(opts.length>=4)break;if(!seen.has(x.t)){seen.add(x.t);opts.push(x)}}
 return opts.sort(()=>Math.random()-.5);
}
function mask(c){const re=new RegExp(c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');return re.test(c.ex)?c.ex.replace(re,'_____'):null}
function buildTest(cards){
 const types=['choice','typing','tf','context'];
 return cards.slice(0,8).map((c,i)=>{
  let t=types[i%4];
  if(t==='context'&&!mask(c))t='choice';
  const o={id:c.id,type:t};
  if(t==='tf'){const other=allCards().filter(x=>x.id!==c.id)[Math.floor(Math.random()*5)]||c;o.truth=Math.random()<.5;o.shown=o.truth?c.t:other.t;if(o.shown===c.t)o.truth=true}
  return o;
 });
}
function ratingApply(r){
 const id=sess.ids[sess.i];const f=findCard(id);const c=f.c;
 const prev={status:c.status,due:c.due,newToday:f.d.newToday};
 const h={id,prev,ins:null,r,wasNew:c.status==='new'};
 if(c.status==='new')f.d.newToday++;
 if(r==='again'){c.due=true;if(c.status==='new')c.status='learning';const at=Math.min(sess.ids.length,sess.i+4);sess.ids.splice(at,0,id);h.ins=at}
 else{c.due=false;c.status=r==='easy'?'mastered':(c.status==='mastered'?'mastered':'learning')}
 sess.answered++;if(r!=='again')sess.correct++;else if(!sess.mistakes.includes(id))sess.mistakes.push(id);
 S.week[6]++;S.total30++;if(r!=='again')S.correct30++;
 sess.hist.push(h);sess.i++;sess.flip=false;
 if(sess.i>=sess.ids.length)finish();else render();
}
function undo(){
 const h=sess.hist.pop();if(!h)return;
 const f=findCard(h.id);Object.assign(f.c,{status:h.prev.status,due:h.prev.due});f.d.newToday=h.prev.newToday;
 if(h.ins!==null)sess.ids.splice(h.ins,1);
 sess.i--;sess.answered--;if(h.r!=='again')sess.correct--;
 S.week[6]--;S.total30--;if(h.r!=='again')S.correct30--;
 sess.flip=false;render();
}
function finish(){
 sess.ms=Date.now()-sess.start;
 stack[stack.length-1]={n:'summary',p:{}};render();
}
function answerQ(correct,card,given){
 const f=findCard(card.id);
 if(sess.mode==='learn'||sess.mode==='test'){
  sess.answered++;if(correct)sess.correct++;else if(!sess.mistakes.includes(card.id))sess.mistakes.push(card.id);
  S.week[6]++;S.total30++;if(correct)S.correct30++;
  if(correct){f.c.status=f.c.status==='new'?'learning':f.c.status;f.c.due=false}
  sess.fb={correct,given};render();
 }
}
function nextQ(){
 const cq=sess.qs[sess.i];
 if(sess.mode==='learn'&&sess.fb&&!sess.fb.correct&&cq.type==='choice'&&!cq.retried){sess.qs.push({id:cq.id,type:'typing',retried:true})}
 sess.fb=null;sess.i++;
 if(sess.i>=sess.qs.length)finish();else render();
}

function openEditor(opts){
 if(opts.deckId){const d=deckById(opts.deckId);ed={deckId:d.id,draftId:null,name:d.name,rows:d.cards.map(c=>({id:c.id,w:c.w,t:c.t,ex:c.ex,ctx:c.ctx,open:!!(c.ex||c.ctx)})),dirty:false}}
 else if(opts.draftId){const dr=S.drafts.find(x=>x.id===opts.draftId);ed={deckId:null,draftId:dr.id,name:dr.name,rows:dr.rows.map(r=>({...r,open:!!(r.ex||r.ctx)})),dirty:false}}
 else ed={deckId:null,draftId:null,name:'',rows:[blankRow(),blankRow(),blankRow()],dirty:false};
 go('editor',{});
}
function saveDraft(){
 if(ed.deckId)return;
 const has=ed.name.trim()||ed.rows.some(r=>r.w||r.t);
 if(!has)return;
 if(!ed.draftId){ed.draftId=nid('dr');S.drafts.unshift({id:ed.draftId,name:'',rows:[]})}
 const dr=S.drafts.find(x=>x.id===ed.draftId);dr.name=ed.name;dr.rows=ed.rows.map(r=>({w:r.w,t:r.t,ex:r.ex,ctx:r.ctx}));
}
function commitEditor(){
 const rows=ed.rows.filter(r=>r.w.trim()&&r.t.trim());
 if(!ed.name.trim()){toast('Введи название колоды');return}
 if(!rows.length){toast('Добавь хотя бы одну карточку со словом и переводом');return}
 if(ed.deckId){
  const d=deckById(ed.deckId);d.name=ed.name.trim();
  const keep=[];
  rows.forEach(r=>{let c=r.id&&d.cards.find(x=>x.id===r.id);if(c){Object.assign(c,{w:r.w.trim(),t:r.t.trim(),ex:r.ex,ctx:r.ctx})}else c={id:nid('c'),w:r.w.trim(),t:r.t.trim(),ex:r.ex,ctx:r.ctx,status:'new',due:true};keep.push(c)});
  d.cards.filter(c=>!keep.includes(c)).forEach(c=>S.trash.unshift({id:nid('t'),type:'card',days:0,deckId:d.id,card:c}));
  d.cards=keep;toast('Колода сохранена');back();return;
 }
 const d={id:nid('d'),name:ed.name.trim(),lang:'Английский',newPerDay:5,newToday:0,retention:0.9,direction:'forward',cards:rows.map(r=>({id:nid('c'),w:r.w.trim(),t:r.t.trim(),ex:r.ex,ctx:r.ctx,status:'new',due:true}))};
 S.decks.unshift(d);
 if(ed.draftId)S.drafts=S.drafts.filter(x=>x.id!==ed.draftId);
 root('library');go('deck',{id:d.id});toast('Колода создана');
}
function exitEditor(){
 const changed=ed.deckId?ed.dirty:(ed.name.trim()||ed.rows.some(r=>r.w||r.t));
 if(!changed){back();return}
 if(ed.deckId){
  modal={type:'dlg',title:'Отменить изменения?',text:'Правки в этой колоде не сохранятся.',btns:[['Остаться',()=>{}, 'sec'],['Отменить изменения',()=>{modal=null;back()},'dng']]};render();return;
 }

  ['Сохранить черновик',()=>{saveDraft();modal=null;back();toast('Черновик сохранён')},'pri'],
  ['Удалить',()=>{if(ed.draftId)S.drafts=S.drafts.filter(x=>x.id!==ed.draftId);modal=null;back()},'dng'],
  ['Остаться',()=>{},'sec']]};render();
}

/* ---------- import ---------- */
function parseImport(){
 const text=imp.text;const lines=text.split(/\r?\n/).filter(l=>l.trim());
 let sep=imp.sep==='auto'?(text.includes('\t')?'\t':text.includes(';')?';':','):({tab:'\t',comma:',',semi:';'})[imp.sep];
 const ok=[],bad=[];
 lines.forEach((l,i)=>{
  const parts=l.split(sep);const w=(parts[0]||'').trim();let t=parts.slice(1).join(sep).trim();
  let ex='',ctx='';
  const m1=t.match(/\s*Ex:\s*(.*?)(?=\s*Контекст:|$)/i);if(m1){ex=m1[1].trim();t=t.replace(m1[0],'')}
  const m2=t.match(/\s*Контекст:\s*(.*)$/i);if(m2){ctx=m2[1].trim();t=t.replace(m2[0],'')}
  t=t.trim().replace(/[.]$/,'');
  if(w&&t)ok.push({w,t,ex,ctx});else bad.push(i+1);
 });
 return {ok,bad,sep};
}
function doImport(){
 const {ok}=parseImport();if(!ok.length)return;
 const cards=ok.map(r=>({id:nid('c'),w:r.w,t:r.t,ex:r.ex,ctx:r.ctx,status:'new',due:true}));
 let d;
 if(imp.mode==='new'){d={id:nid('d'),name:(imp.name||'Импортированная колода'),lang:'Английский',newPerDay:5,newToday:0,retention:0.9,direction:'forward',cards};S.decks.unshift(d)}
 else{d=deckById(imp.target||S.decks[0].id);d.cards.push(...cards)}
 const n=cards.length;imp={text:'',sep:'auto',mode:'new',name:'',target:''};
 root('library');go('deck',{id:d.id});toast('Импортировано: '+nCards(n));
}

function delCard(did,cid){const d=deckById(did),c=d.cards.find(x=>x.id===cid);d.cards=d.cards.filter(x=>x!==c);S.trash.unshift({id:nid('t'),type:'card',days:0,deckId:did,card:c});toast('Карточка удалена, её можно вернуть в корзине')}
function deckMenu(id){
 sheet(`<h3>Колода</h3><div class="list"><button class="li" data-m="0"><div class="t">Настройки колоды</div></button><button class="li" data-m="1"><div class="t">Дублировать</div></button><button class="li" data-m="2"><div class="t">Сбросить прогресс</div></button><button class="li" data-m="3"><div class="t">Экспорт колоды</div></button><button class="li" data-m="4"><div class="t" style="color:var(--again)">Удалить</div></button></div>`,
 [()=>deckSettings(id),()=>{const d=deckById(id);const cp=JSON.parse(JSON.stringify(d));cp.id=nid('d');cp.name=d.name+' (копия)';cp.cards.forEach(c=>c.id=nid('c'));S.decks.splice(S.decks.indexOf(d)+1,0,cp);modal=null;toast('Колода продублирована');render()},
  ()=>{modal={type:'dlg',title:'Сбросить прогресс?',text:'Все карточки колоды станут новыми. Оценки сотрутся.',btns:[['Отмена',()=>{},'sec'],['Сбросить',()=>{deckById(id).cards.forEach(c=>{c.status='new';c.due=true});modal=null;toast('Прогресс сброшен');render()},'dng']]};render()},
  ()=>{const d=deckById(id);try{const tsv=d.cards.map(c=>c.w+'\t'+c.t+(c.ex?' Ex: '+c.ex:'')+(c.ctx?' Контекст: '+c.ctx:'')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([tsv],{type:'text/tab-separated-values'}));a.download=d.name+'.tsv';a.click()}catch(e){}modal=null;toast('Колода экспортирована в TSV');render()},
  ()=>askDeleteDeck(id)]);
}
function deckSettings(id){
 const d=deckById(id);
 sheet(`<h3>Настройки колоды</h3>
 <div><label class="f">Название</label><input class="input" data-s="name" value="${esc(d.name)}"></div>
 <div><label class="f">Язык</label><select class="sel" data-s="lang">${['Английский','Немецкий','Турецкий','Другой'].map(l=>`<option ${d.lang===l?'selected':''}>${l}</option>`).join('')}</select></div>
 <div><label class="f">Цель удержания</label><select class="sel" data-s="retention">${[[0.85,'85%, меньше повторений'],[0.9,'90%, обычный режим'],[0.95,'95%, больше повторений']].map(([v,l])=>`<option value="${v}" ${d.retention===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div><label class="f">Новых карточек в день</label><input class="input" type="number" min="0" max="50" data-s="newPerDay" value="${d.newPerDay}"></div>
 <div><label class="f">Направление</label><select class="sel" data-s="direction"><option value="forward" ${d.direction==='forward'?'selected':''}>Слово → перевод</option><option value="backward" ${d.direction==='backward'?'selected':''}>Перевод → слово</option><option value="mixed" ${d.direction==='mixed'?'selected':''}>Смешанное</option></select></div>
 <button class="btn pri" data-m="0">Сохранить</button>`,
 [()=>{const s=modal.state;if(s.name)d.name=s.name;if(s.lang)d.lang=s.lang;if(s.retention)d.retention=+s.retention;if(s.newPerDay!==undefined)d.newPerDay=Math.max(0,+s.newPerDay||0);if(s.direction)d.direction=s.direction;modal=null;toast('Настройки сохранены');render()}],{});
}
function cardEdit(did,cid){
 const d=deckById(did),c=d.cards.find(x=>x.id===cid);
 sheet(`<h3>Правка карточки</h3>
 <div><label class="f">Слово</label><input class="input" data-s="w" value="${esc(c.w)}"></div>
 <div><label class="f">Перевод</label><input class="input" data-s="t" value="${esc(c.t)}"></div>
 <div><label class="f">Пример с этим словом</label><input class="input" data-s="ex" value="${esc(c.ex)}"></div>
 <div><label class="f">Контекст (заметка)</label><input class="input" data-s="ctx" value="${esc(c.ctx)}"></div>
 <button class="btn pri" data-m="0">Сохранить</button><button class="btn sec" data-m="1" style="color:var(--again)">Удалить карточку</button>`,
 [()=>{const s=modal.state;['w','t','ex','ctx'].forEach(k=>{if(s[k]!==undefined)c[k]=s[k]});modal=null;toast('Карточка сохранена');render()},
  ()=>{d.cards=d.cards.filter(x=>x!==c);S.trash.unshift({id:nid('t'),type:'card',days:0,deckId:did,card:c});modal=null;toast('Карточка удалена');render()}],{});
}

/* ---------- actions ---------- */
const A={
 tab:e=>root(e.dataset.v),
 settings:()=>go('settings'),
 gotodata:()=>go('data'),
 lang:()=>sheet(`<h3>Язык</h3><div class="list"><button class="li" data-m="0"><div class="t">Русский</div></button><button class="li" data-m="1"><div class="t">English</div></button></div>`,[()=>closeModal(),()=>{modal=null;toast('В прототипе доступен только русский');render()}]),
 backup:()=>{S.lastBackup=0;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.decks,null,1)],{type:'application/json'}));a.download='thoth-backup.json';a.click()}catch(e){}toast('Копия скачана');},
 restore:()=>{modal={type:'dlg',title:'Восстановить из файла',text:'Перед восстановлением приложение сохранит снимок текущих данных, чтобы можно было отменить.',btns:[['Объединить с текущими',()=>{S.restored=true;modal=null;toast('Данные объединены');render()},'pri'],['Заменить текущие',()=>{S.restored=true;modal=null;toast('Данные заменены');render()},'dng'],['Отмена',()=>{},'sec']]};render()},
 undorestore:()=>{S.restored=false;toast('Восстановление отменено, данные возвращены')},
 back:()=>back(),
 plus:()=>createMenu(),
 newdeck:()=>openEditor({}),
 import:()=>go('import'),
 starter:()=>{const d={id:nid('d'),name:'Стартовый набор',lang:'Английский',newPerDay:5,newToday:0,retention:0.9,direction:'forward',cards:mk(W.slice(0,8),[])};S.decks.unshift(d);root('library');go('deck',{id:d.id});toast('Стартовый набор добавлен')},
 deck:e=>{q.deck='';dv={i:0,flip:false,f:'all'};go('deck',{id:e.dataset.id})},
 pvflip:()=>{dv.flip=!dv.flip;render()},
 chip:e=>{dv.f=e.dataset.v;render()},
 fav:e=>{const c=deckById(e.dataset.d).cards.find(x=>x.id===e.dataset.id);c.fav=!c.fav;render()},
 speak:e=>{try{const u=new SpeechSynthesisUtterance(e.dataset.t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){toast('Озвучка недоступна в этом браузере')}},
 editdeck:e=>openEditor({deckId:e.dataset.id}),
 deckmenu:e=>deckMenu(e.dataset.id),
 draft:e=>openEditor({draftId:e.dataset.id}),
 trash:()=>go('trash'),
 cardedit:e=>cardEdit(e.dataset.d,e.dataset.id),
 start:e=>startSession(e.dataset.m,e.dataset.deck||null,e.dataset.x==='1'),
 flip:()=>{sess.flip=!sess.flip;render()},
 rate:e=>ratingApply(e.dataset.r),
 undo:()=>undo(),
 exits:()=>{stack.pop();render()},
 pick:e=>{const cq=sess.qs[sess.i];const c=findCard(cq.id).c;answerQ(e.dataset.id===c.id,c,e.dataset.id)},
 check:()=>{const cq=sess.qs[sess.i];const c=findCard(cq.id).c;const v=$('#typed').value.trim();answerQ(v.toLowerCase()===c.w.toLowerCase(),c,v)},
 tf:e=>{const cq=sess.qs[sess.i];const c=findCard(cq.id).c;answerQ((e.dataset.v==='1')===cq.truth,c,'')},
 nextq:()=>nextQ(),
 more:()=>{const m=sess.mode,d=sess.deckId;stack.pop();startSession(m,d,true)},
 summtest:()=>{const d=sess.deckId;stack.pop();startSession('test',d,true)},
 summdone:()=>{stack.pop();render()},
 exited:()=>exitEditor(),
 commited:()=>commitEditor(),
 addrow:()=>{ed.rows.push(blankRow());ed.dirty=true;saveDraft();focusId='rw'+(ed.rows.length-1);render()},
 delrow:e=>{ed.rows.splice(+e.dataset.idx,1);if(!ed.rows.length)ed.rows.push(blankRow());ed.dirty=true;saveDraft();render()},
 togrow:e=>{const r=ed.rows[+e.dataset.idx];r.open=!r.open;render()},
 impsample:()=>{imp.text='ubiquitous\tповсеместный. Ex: Phones are ubiquitous.\nephemeral\tнедолговечный\nmeticulous\tдотошный. Контекст: о людях\nplaceholder\nresilient\tстойкий';render()},
 doimport:()=>doImport(),
 restoreitem:e=>{const t=S.trash.find(x=>x.id===e.dataset.id);
  if(t.type==='deck'){S.decks.unshift(t.deck);}else{const d=deckById(t.deckId);if(!d){toast('Сначала восстанови колоду этой карточки');return}d.cards.push(t.card)}
  S.trash=S.trash.filter(x=>x!==t);toast('Восстановлено')},
 killitem:e=>{const t=S.trash.find(x=>x.id===e.dataset.id);modal={type:'dlg',title:'Удалить навсегда?',text:'Это действие нельзя отменить.',btns:[['Отмена',()=>{},'sec'],['Удалить навсегда',()=>{S.trash=S.trash.filter(x=>x!==t);modal=null;render()},'dng']]};render()},
 cleartrash:()=>{modal={type:'dlg',title:'Очистить «Недавно удалённые»?',text:'Всё, что здесь лежит, удалится навсегда.',btns:[['Отмена',()=>{},'sec'],['Очистить',()=>{S.trash=[];modal=null;render()},'dng']]};render()},
 scrimclose:()=>closeModal(),
 mapopen:()=>{sheet('<h3>Карта экранов</h3>'+mapHtml(true),window.__mapfns=[],{});modal.fns=MAPFNS()}
};
document.addEventListener('click',e=>{
 const stop=e.target.closest('[data-stop]');
 const m=e.target.closest('[data-m]');
 if(m&&modal&&!m.dataset.a){const i=+m.dataset.m;if(modal.type==='dlg'){const f=modal.btns[i][1];const before=modal;f();if(modal===before)closeModal()}else{modal.fns[i]&&modal.fns[i]()}return}
 const el=e.target.closest('[data-a]');
 if(!el)return;
 if(el.dataset.a==='scrimclose'&&stop)return;
 if(el.dataset.a==='scrimclose'&&e.target.closest('[data-stop]'))return;
 if(el.dataset.a==='jump'){jump(el.dataset.v);return}
 const f=A[el.dataset.a];if(f)f(el);
});
document.addEventListener('input',e=>{
 const t=e.target,k=t.dataset.i,s=t.dataset.s;
 if(s&&modal){modal.state[s]=t.value;return}
 if(!k)return;
 const idx=+t.dataset.idx;
 if(k==='qlib'){q.lib=t.value;focusId='qlib';render()}
 else if(k==='qdeck'){q.deck=t.value;focusId='qdeck';render()}
 else if(k==='edname'){ed.name=t.value;ed.dirty=true;saveDraft()}
 else if(['rw','rt','rex','rctx'].includes(k)){const key={rw:'w',rt:'t',rex:'ex',rctx:'ctx'}[k];ed.rows[idx][key]=t.value;ed.dirty=true;saveDraft()}
 else if(k==='imptext'){imp.text=t.value;focusId='imptext';render()}
 else if(k==='impname'){imp.name=t.value}
});
document.addEventListener('change',e=>{
 const t=e.target,k=t.dataset.i;
 if(t.id==='impfile'){const f=t.files[0];if(f){f.text().then(x=>{imp.text=x;render()})}return}
 if(k==='impsep'){imp.sep=t.value;render()}
 else if(k==='impmode'){imp.mode=t.value;render()}
 else if(k==='imptarget'){imp.target=t.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typed'){A.check()}});


/* ---------- swipes ---------- */
let swp=null, suppressUntil=0, suppressEl=null;
document.addEventListener('click',e=>{if(Date.now()<suppressUntil&&(!suppressEl||suppressEl.contains(e.target))){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('pointerdown',e=>{
 if(modal||e.target.closest('input,textarea,select'))return;
 swp={x:e.clientX,y:e.clientY,dx:0,drag:false,row:e.target.closest('[data-swipe]')};
});
document.addEventListener('pointermove',e=>{
 if(!swp)return;
 const dx=e.clientX-swp.x,dy=e.clientY-swp.y;
 if(!swp.drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){swp.drag=true;if(swp.row)swp.row.classList.add('drag')}
 if(!swp.drag)return;
 swp.dx=dx;
 const r=swp.row;if(!r)return;
 const t=r.dataset.swipe;
 if(t==='carousel'||t==='fcard'){r.style.transform=`translateX(${dx*0.4}px) rotate(${dx/50}deg)`}
 else{const fg=r.querySelector('.swfg');fg.style.transform=`translateX(${Math.max(-130,Math.min(130,dx))}px)`;r.dataset.dir=dx>0?'r':'l'}
});
function swipeEnd(cancel){
 const s=swp;swp=null;if(!s||!s.drag)return;
 suppressUntil=Date.now()+250;suppressEl=s.row;
 const dx=s.dx,TH=80,r=s.row;
 if(r){
  r.classList.remove('drag');
  const t=r.dataset.swipe;
  if(t==='carousel'||t==='fcard')r.style.transform='';else{const fg=r.querySelector('.swfg');fg.style.transform=''}
  if(cancel)return;
  const id=r.dataset.id,did=r.dataset.d;
  if(t==='deck'){if(dx>TH)askDeleteDeck(id);else if(dx<-TH)deckSettings(id)}
  else if(t==='card'){if(dx>TH){delCard(did,id)}else if(dx<-TH)cardEdit(did,id)}
  else if(t==='draft'){if(dx>TH){S.drafts=S.drafts.filter(x=>x.id!==id);toast('Черновик удалён')}else if(dx<-TH)openEditor({draftId:id})}
  else if(t==='carousel'){const d=deckById(cur().p.id);if(dx<-TH){dv.i=(dv.i+1)%d.cards.length;dv.flip=false;render()}else if(dx>TH){dv.i=(dv.i-1+d.cards.length)%d.cards.length;dv.flip=false;render()}}
  else if(t==='fcard'){if(sess.flip){if(dx>TH)ratingApply('good');else if(dx<-TH)ratingApply('again')}}
  return;
 }
 if(cancel)return;
 const n=cur().n;
 if(['session','summary','editor'].includes(n))return;
 if(dx>TH*1.3){if(stack.length>1)back()}
 else if(dx<-TH*1.3){if(fwd.length){stack.push(fwd.pop());render()}}
}
document.addEventListener('pointerup',()=>swipeEnd(false));
document.addEventListener('pointercancel',()=>swipeEnd(true));

/* ---------- screen map panel ---------- */
const MAP=[['Сегодня',[['1','Сегодня','today'],['2','Настройки','settings'],['3','Данные и копии','data']]],['Библиотека',[['4','Библиотека','library'],['5','Колода','deck'],['6','Редактор колоды','editor'],['7','Импорт','import'],['8','Недавно удалённые','trash']]],['Статистика',[['9','Статистика','stats']]],['Сессии',[['10','Карточки','study'],['11','Заучивание','learn'],['12','Тест','test'],['13','Итог','summary']]]];
function mapHtml(inSheet){
 return MAP.map(([g,items])=>`<div class="grp">${g}</div>${items.map(([n,l,k])=>`<button class="j" data-a="jump" data-v="${k}"><i>${n}</i>${l}</button>`).join('')}`).join('')+`<button class="reset" data-a="jump" data-v="reset">Сбросить данные прототипа</button>`;
}
function MAPFNS(){return []}
function renderSide(){const s=$('#side');if(s&&!s.dataset.done){s.innerHTML=`<h2>Карта экранов</h2><p>Нажми на экран, чтобы открыть его. Нижняя панель видна только на экранах 1, 4 и 9.</p>`+mapHtml();s.dataset.done=1}}
function jump(v){
 modal=null;toastMsg='';
 if(v==='reset'){S=initial();q={lib:'',deck:''};sess=null;root('today');return}
 if(v==='today'){root('today')}
 else if(v==='settings'){root('today');go('settings')}
 else if(v==='data'){root('today');go('settings');go('data')}
 else if(v==='library'){root('library')}
 else if(v==='deck'){root('library');dv={i:0,flip:false,f:'all'};go('deck',{id:S.decks[0].id})}
 else if(v==='editor'){root('library');openEditor({})}
 else if(v==='import'){root('library');go('import')}
 else if(v==='trash'){root('library');go('trash')}
 else if(v==='stats'){root('stats')}
 else if(v==='study'||v==='learn'||v==='test'){root('today');startSession(v,null,false)}
 else if(v==='summary'){root('today');startSession('study',null,false);if(sess){sess.answered=8;sess.correct=6;sess.mistakes=sess.ids.slice(0,2);sess.ms=252000;stack[stack.length-1]={n:'summary',p:{}};render()}}
}
render();
</script>
